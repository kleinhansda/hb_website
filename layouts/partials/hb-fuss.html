<footer class="hb-fuss">
  <div class="hb-fuss__innen">
    <div>
      <img class="hb-fuss__marke" src="{{ "images/neu/wortmarke-weiss.png" | relURL }}" alt="{{ site.Title }}" width="1200" height="420" loading="lazy">
      <address>
        {{ site.Params.adresse }}
      </address>
    </div>
    <div class="hb-fuss__rechts">
      {{ partial "hb-piktogramme.html" . }}
      <p><a href="{{ "/impressum/" | relLangURL }}">{{ i18n "hb_impressum" }}</a> · <a href="{{ "/datenschutz/" | relURL }}">{{ i18n "hb_datenschutz" }}</a></p>
      <p class="hb-fuss__copy">© {{ now.Format "2006" }} {{ site.Title }}</p>
    </div>
  </div>
</footer>
