# Sonderbiere. Reihenfolge = Reihenfolge auf der Website.
# Tony, Dunkles Geheimnis und Noigeblaggder: Texte von den Etiketten übernommen.
# Urbock: Name aus EAN-Liste und altem Archiv. Pils ist seit 2026-10-20 ein Stammbier (data/biere.yaml).
# Malz und Hopfen: Word-Dokument "Inhalte Malz u. Hopfensorten" (2026-10-18).
# Urbock = Urstoff mit mehr Schüttung pro Wasser (Bockbier). Malz/Hopfen wie Urstoff.
- name: Tony
  farbe: "#D9892B"
  art: "IPA nach amerikanischer Art"
  malz: "Pilsener, Münchner"
  hopfen: "Hallertauer Perle, Mandarina Bavaria"
  beschreibung: "Intensive Hopfenaromen nach Aprikose, Pfirsich und Honigmelone, dazu ausgewogene Bitterkeit und ein vollmundiger Körper. Voller Geschmack auf kleinem Raum, geboren in Viernheim, genau wie unser Brauereihund Tony: charmant, verspielt und einfach zum Verlieben."
  zutaten: "Wasser, Gerstenmalz, Hopfen, Hefe"
  sommelier: "Orangegolden, in der Nase ein Korb voller Steinobst: Aprikose, Pfirsich, Honigmelone. Kräftiger Malzkörper, ausgewogene Bittere und ein langer, fruchtiger Nachhall."
  profil_malz: [pilsner, muenchner]
  profil_hopfen: [perle, mandarina]

- name: Dunkles Geheimnis
  farbe: "#3B2418"
  art: "Editionsbier zur BestBrewChallenge 2026"
  malz: "Weizenmalz hell, Weizenmalz dunkel, Pilsener, Münchner, Caramünch, Röstmalz"
  hopfen: "Hallertau Blanc"
  beschreibung: "Vollmundig mit Karamell-, Schoko- und Fruchtnoten."
  zutaten: "Wasser, Weizenmalz, geröstetes Gerstenmalz, Hefe, Hopfen"
  sommelier: "Tiefbraun, mit Duft nach Karamell, Kakao und dunklen Früchten. Vollmundig und weich, im Abgang eine sanfte Röstnote."
  profil_malz: [weizen_hell, weizen_dunkel, pilsner, muenchner, caramuench, roestmalz]
  profil_hopfen: [hallertau_blanc]

- name: Noigeblaggder
  farbe: "#4A2A1A"
  art: "Dunkles Hopfenweizen"
  malz: "Pilsener, Caramünch, Weizenmalz, Röstmalz"
  hopfen: "Hallertau Blanc"
  beschreibung: "Fruchtig-hopfig, malzaromatisch und vollmundig."
  zutaten: "Wasser, Weizenmalz, Gerstenmalz, Hefe, Hopfen"
  sommelier: "Kastanienbraun. Fruchtig-hopfige Nase mit Grapefruit und Stachelbeere über Brotkruste und Röstmalz. Vollmundig und malzaromatisch, mit frischem Finish."
  profil_malz: [pilsner, caramuench, weizen_hell, roestmalz]
  profil_hopfen: [hallertau_blanc]

- name: Vernemmer Urstoff
  bild: /images/biere/urstoff_kelch.jpg
  farbe: "#2B1A14"
  art: "Obergäriges Stout"
  malz: "Pilsener, Münchner, Weizenmalz, Caramünch 2, Röstmalz"
  hopfen: "Hallertauer Perle, Cascade, Hallertau Blanc"
  beschreibung: "Weich, mit malzigen Röstaromen und karamellig-bananigem Charakter. Mild gehopft."
  sommelier: "Fast schwarz. Weiche Röstaromen von Kaffee und Kakao, darunter Karamell und eine bananige Note. Rund und mild gehopft."
  profil_malz: [pilsner, muenchner, weizen_hell, caramuench, roestmalz]
  profil_hopfen: [perle, cascade, hallertau_blanc]

- name: Vernemmer Urbock
  farbe: "#2B1A14"
  art: "Bockbier-Variante des Urstoffs"
  malz: "Pilsener, Münchner, Weizenmalz, Caramünch 2, Röstmalz"
  hopfen: "Hallertauer Perle, Cascade, Hallertau Blanc"
  beschreibung: "Wie der Urstoff, nur meeeehr: gleiches Rezept, aber mit mehr Malz im Verhältnis zum Wasser. Dadurch wird aus dem Ur-Stoff ein Ur-Bock, kräftiger und stärker."
  sommelier: "Der Urstoff in voller Kraft: dichter Körper, mehr Malzsüße, Röstaromen von Kaffee und Kakao und ein warmer, langer Abgang."
  profil_malz: [pilsner, muenchner, weizen_hell, caramuench, roestmalz]
  profil_hopfen: [perle, cascade, hallertau_blanc]
