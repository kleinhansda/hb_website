# Rohstoff-Profile für die Charakter-Popups (Netzdiagramme, eigene Darstellung).
# Malz: Werte 0 bis 5, abgelesen aus dem Weyermann® Malz Aroma Rad (Würze), © Weyermann® Specialty Malts.
#   Kaffee-Werte aus dem Linienverlauf rekonstruiert (Punkt dort vom Skalen-Etikett verdeckt). Auf 0,5 gerundet.
#   "referenz" = Weyermann-Sorte, die als Referenz dient (unser Lieferant/genaue Sorte ggf. anders).
#   Röstmalz: Annahme CARAFA® (nicht bestätigt).
# Hopfen: Werte = "Durchschnittliche Schlüsselaromen seit 2018" aus dem BarthHaas Hop Harvest Guide 2021 (relative Skala).
#   Tettnanger: nicht im Guide. Werte aus dem "Aromaprofil" der BarthHaas-Webseite (Typisches Aromaprofil), Blattlängen vom Screenshot
#   gemessen (Länge / Ringradius x 100, auf ganze Zahlen gerundet). Gleiche Skala wie der Guide: gleiche Messung ergibt für Perle die Guide-Werte.
#   Die Webseite zeigt ein typisches Profil, der Guide den Durchschnitt seit 2018. Nicht identisch definiert, daher Näherung.
# dx/dy in den Achsen = Richtung der Achse (sin/cos), vorberechnet, weil Hugo 0.125 keine Winkelfunktionen hat.
