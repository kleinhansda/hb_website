MetaDataFormat = "yaml"
DefaultContentLanguage = "de"
defaultContentLanguageInSubdir = false
Paginate = 3 # this is set low for demonstrating with dummy content. Set to a higher number
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  favicon = ""
  description = "Mikrobrauerei HannesBräu in Viernheim: frisch, regional und naturbelassen gebrautes Bier, Ausschank mit Live-Musik und Bierseminare."
  images = ["images/neu/banner-1400.jpg"]
  #site_logo = "images/main/logo.png"
  instagram = "https://www.instagram.com/hannesbraeu/"
  facebook = "https://www.facebook.com/HannesBr%C3%A4u-113490456706196/?view_public_for=113490456706196/"
  #twitter = "https://twitter.com/brau_hannes"
  google = "https://g.page/hbverne?share"
  shop = "https://hannesbraeu.sumup.link/"
  merch = "https://hannesbrau.myspreadshop.de/"
  #youtube = ""
  #github = ""
  # choose a background color from any on this page: http://tachyons.io/docs/themes/skins/ and preface it with "bg-"
  background_color_class = "bg-near-black"
  #featured_image = "/images/gohugo-default-sample-hero-image.jpg"
  recent_posts_number = 2
  custom_css = ["css/main.css"]
  kontakt_email = "info@hannesbräu.de"
  kontakt_email_href = "info@xn--hannesbru-22a.de"
  kontakt_telefon = "06204 611206"
  kontakt_telefon_href = "+496204611206"
  adresse = "Einsteinstraße 8, 68519 Viernheim"
  body_classes = "avenir bg-near-white"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Sprachen: Hochdeutsch (Standard) und Kurpfälzisch (pfl = Pfälzisch, ISO 639-3)
[languages]
  [languages.de]
    languageName = "Hochdeutsch"
    languageCode = "de"
    weight = 1
    [[languages.de.menus.main]]
      name = "Über uns"
      pageRef = "/ueber-uns"
      weight = 1
    [[languages.de.menus.main]]
      name = "Veranstaltungen"
      pageRef = "/veranstaltungen"
      weight = 2
    [[languages.de.menus.main]]
      name = "Sonderbiere"
      pageRef = "/sonderbiere"
      weight = 3
    [[languages.de.menus.main]]
      name = "Mieten & Shop"
      pageRef = "/buchen-mieten"
      weight = 4
  [languages.pfl]
    languageName = "Kurpälzisch"
    languageCode = "de-x-pfl"
    weight = 2
    [[languages.pfl.menus.main]]
      name = "Iwwer uns"
      pageRef = "/ueber-uns"
      weight = 1
    [[languages.pfl.menus.main]]
      name = "Feschdle"
      pageRef = "/veranstaltungen"
      weight = 2
    [[languages.pfl.menus.main]]
      name = "Sunnerbier"
      pageRef = "/sonderbiere"
      weight = 3
    [[languages.pfl.menus.main]]
      name = "Miete unn Lade"
      pageRef = "/buchen-mieten"
      weight = 4
